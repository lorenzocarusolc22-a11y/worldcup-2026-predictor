<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIFA World Cup 2026 Predictor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#08111e;color:#e8e8e8;min-height:100vh}
nav{position:sticky;top:0;z-index:100;background:linear-gradient(90deg,#0a1628 0%,#1a2744 50%,#0a1628 100%);border-bottom:2px solid #c9a227;display:flex;align-items:center;padding:0 24px;height:64px}
.nav-brand{font-size:1.1rem;font-weight:700;color:#c9a227;letter-spacing:.04em;margin-right:auto;display:flex;align-items:center;gap:10px}
.nav-brand span{font-size:1.5rem}
.nav-tabs{display:flex;gap:4px}
.nav-tab{background:none;border:none;color:#8899bb;font-size:.9rem;font-weight:600;padding:10px 22px;border-radius:6px 6px 0 0;cursor:pointer;letter-spacing:.03em;transition:all .2s;position:relative;top:2px}
.nav-tab:hover{color:#e8e8e8;background:rgba(201,162,39,.12)}
.nav-tab.active{color:#c9a227;background:rgba(201,162,39,.18);border-bottom:2px solid #c9a227}
.screen{display:none;padding:28px 32px;min-height:calc(100vh - 64px)}
.screen.active{display:block}
h2{color:#c9a227;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:22px;display:flex;align-items:center;gap:10px}
.flag{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.18);flex-shrink:0;background:#1a2744}
.flag-sm{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.15);flex-shrink:0;background:#1a2744}
/* GROUP STAGE */
.groups-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.group-card{background:linear-gradient(160deg,#0e1f38,#111d33);border:1.5px solid #1e3058;border-radius:12px;padding:18px 16px 14px;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.group-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#c9a227,#ffda44,#c9a227);opacity:0;transition:opacity .2s}
.group-card:hover{border-color:#c9a227;transform:translateY(-2px);box-shadow:0 8px 28px rgba(201,162,39,.18)}
.group-card:hover::before{opacity:1}
.group-card-title{font-size:1rem;font-weight:700;color:#c9a227;letter-spacing:.08em;margin-bottom:12px}
.group-card-teams{display:flex;flex-direction:column;gap:7px}
.group-card-team{display:flex;align-items:center;gap:9px;font-size:.84rem;color:#c8d4e8}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(4,10,22,.88);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:linear-gradient(160deg,#0d1c33,#111d33);border:1.5px solid #c9a227;border-radius:16px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;padding:28px;position:relative}
.modal-close{position:absolute;top:14px;right:18px;background:none;border:none;color:#8899bb;font-size:1.6rem;cursor:pointer;line-height:1;transition:color .15s}
.modal-close:hover{color:#c9a227}
.modal-title{font-size:1.15rem;font-weight:700;color:#c9a227;letter-spacing:.06em;margin-bottom:20px}
.standings{width:100%;border-collapse:collapse;font-size:.84rem;margin-bottom:20px}
.standings th{color:#6a7fa0;font-weight:600;text-transform:uppercase;font-size:.7rem;letter-spacing:.07em;padding:6px 10px;border-bottom:1px solid #1e3058;text-align:left}
.standings td{padding:8px 10px;border-bottom:1px solid #131f35}
.standings tr:last-child td{border-bottom:none}
.team-cell{display:flex;align-items:center;gap:9px}
.pos{color:#6a7fa0;font-weight:700;width:20px;text-align:center}
.qualified{color:#4adf8a !important}
.num{text-align:right;color:#8faabb}
.matchday-label{font-size:.72rem;font-weight:700;color:#c9a227;text-transform:uppercase;letter-spacing:.1em;margin:14px 0 7px;padding-bottom:4px;border-bottom:1px solid #1a2e4a}
.match-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #0e1c30;font-size:.84rem}
.match-row:last-child{border-bottom:none}
.match-team{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.match-team.right{justify-content:flex-end;flex-direction:row-reverse}
.match-score{font-weight:700;color:#e8e8e8;background:#0a1525;border-radius:6px;padding:3px 12px;font-size:.88rem;min-width:68px;text-align:center;flex-shrink:0;border:1px solid #1a2e4a}
/* BRACKET */
.champion-banner{text-align:center;padding:16px 10px 14px;margin-bottom:12px}
.champion-label{font-size:.72rem;font-weight:700;color:#8899bb;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.champion-team{display:inline-flex;align-items:center;gap:12px;font-size:1.35rem;font-weight:800;color:#ffda44;background:linear-gradient(135deg,#1a2f10,#1f3a14);border:2px solid #c9a227;border-radius:12px;padding:10px 22px}
.champion-team .flag{width:36px;height:36px;border-color:rgba(201,162,39,.4)}
.champion-prob{font-size:.85rem;color:#aab8cc;font-weight:500;margin-left:4px}
.bracket-outer{overflow-x:auto;padding-bottom:20px}
.bracket-rounds-hdr{display:flex;margin-bottom:6px}
.rh{text-align:center;font-size:.68rem;font-weight:700;color:#6a7fa0;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
/* bracket match card — sized by JS constants below */
.bm{background:linear-gradient(135deg,#0e1f38,#111d33);border:1.5px solid #1e3058;border-radius:8px;padding:5px 8px;position:absolute;transition:border-color .2s;overflow:hidden}
.bm:hover{border-color:#3a5888}
.bm-num{font-size:.58rem;color:#445566;font-weight:600;letter-spacing:.04em;margin-bottom:3px}
.bm-team{display:flex;align-items:center;gap:5px;padding:3px 0;font-size:.76rem;font-weight:500;color:#c8d4e8;min-width:0}
.bm-team.winner{color:#c9a227;font-weight:700}
.bm-prob{font-size:.66rem;color:#4a6080;margin-left:auto;padding-left:3px;flex-shrink:0}
.bm-divider{border:none;border-top:1px solid #1a2e4a;margin:2px 0}
.bm-score{font-size:.72rem;color:#6a7fa0;text-align:center;margin-top:4px;letter-spacing:.04em;font-weight:600}
.bm.final-match{border-color:#c9a227;box-shadow:0 0 20px rgba(201,162,39,.25)}
.bm.final-match .bm-team.winner{color:#ffda44}
.bm.final-match .bm-score{color:#a08030}
.third-block{margin-top:28px;padding-top:16px;border-top:1px solid #1a2e4a}
.third-label{font-size:.72rem;font-weight:700;color:#6a7fa0;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
/* PROBABILITIES */
.prob-list{max-width:740px}
.prob-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #0e1c30}
.prob-row:last-child{border-bottom:none}
.prob-rank{font-size:.78rem;color:#445566;font-weight:700;width:26px;text-align:right;flex-shrink:0}
.prob-team{display:flex;align-items:center;gap:9px;width:190px;flex-shrink:0}
.prob-team-name{font-size:.88rem;font-weight:500}
.prob-bar-wrap{flex:1;height:20px;background:#0a1525;border-radius:4px;overflow:hidden}
.prob-bar{height:100%;border-radius:4px}
.prob-pct{font-size:.86rem;font-weight:700;width:48px;text-align:right;flex-shrink:0}
.gold .prob-bar{background:linear-gradient(90deg,#a07c10,#ffda44)}
.gold .prob-pct,.gold .prob-rank{color:#ffda44}
.silver .prob-bar{background:linear-gradient(90deg,#5a6f88,#b0c4d8)}
.silver .prob-pct,.silver .prob-rank{color:#b0c4d8}
.bronze .prob-bar{background:linear-gradient(90deg,#7a3f1a,#cd7f32)}
.bronze .prob-pct,.bronze .prob-rank{color:#cd7f32}
.other .prob-bar{background:linear-gradient(90deg,#1a3a70,#2a5aad)}
.other .prob-pct{color:#7aaabb}
</style>
</head>

function flagUrl(t){ const c=FLAG_ISO[t]; return c?'https://flagcdn.com/w40/'+c+'.png':''; }
function flagImg(t,cls='flag'){
  const u=flagUrl(t);
  return u?'<img class="'+cls+'" src="'+u+'" alt="'+t+'" loading="lazy" onerror="this.style.display=\'none\'">':'';
}
function showScreen(id,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}
function closeModal(e){ if(e.target===document.getElementById('modal')) document.getElementById('modal').classList.remove('open'); }

/* ---- GROUP STAGE ---- */
function buildGroups(){
  const grid=document.getElementById('groups-grid');
  Object.entries(DATA.gironi).forEach(([name,g])=>{
    const d=document.createElement('div');
    d.className='group-card';
    d.innerHTML='<div class="group-card-title">Group '+name+'</div>'
      +'<div class="group-card-teams">'
      +g.classifica.map(t=>'<div class="group-card-team">'+flagImg(t.team)+'<span>'+t.team+'</span></div>').join('')
      +'</div>';
    d.onclick=()=>openGroupModal(name,g);
    grid.appendChild(d);
  });
}
function openGroupModal(name,g){
  const byDay={1:[],2:[],3:[]};
  g.partite.forEach(p=>byDay[p.giornata].push(p));
  let h='<div class="modal-title">Group '+name+'</div>';
  h+='<table class="standings"><thead><tr><th>#</th><th>Team</th><th>Pts</th><th>GF</th><th>GS</th><th>Pass%</th></tr></thead><tbody>';
  g.classifica.forEach((t,i)=>{
    const q=i<2?'qualified':'';
    h+='<tr><td><span class="pos '+q+'">'+(i+1)+'</span></td>'
      +'<td><div class="team-cell">'+flagImg(t.team)+'<span>'+t.team+'</span></div></td>'
      +'<td class="num">'+t.punti.toFixed(1)+'</td><td class="num">'+t.gf.toFixed(1)+'</td>'
      +'<td class="num">'+t.gs.toFixed(1)+'</td><td class="num">'+t.pass_pct.toFixed(0)+'%</td></tr>';
  });
  h+='</tbody></table>';
  [1,2,3].forEach(d=>{
    if(!byDay[d].length) return;
    h+='<div class="matchday-label">Matchday '+d+'</div>';
    byDay[d].forEach(m=>{
      h+='<div class="match-row">'
        +'<div class="match-team">'+flagImg(m.squadra_a,'flag-sm')+'<span>'+m.squadra_a+'</span></div>'
        +'<div class="match-score">'+m.gol_a.toFixed(1)+'&ndash;'+m.gol_b.toFixed(1)+'</div>'
        +'<div class="match-team right">'+flagImg(m.squadra_b,'flag-sm')+'<span>'+m.squadra_b+'</span></div>'
        +'</div>';
    });
  });
  document.getElementById('modal-content').innerHTML=h;
  document.getElementById('modal').classList.add('open');
}

/* ---- BRACKET ----
   Layout constants. topOf(round, matchIndex) gives the absolute top px
   for a card in that round. Each R32 slot = SLOT px; higher rounds
   span 2^round slots so their cards are vertically centred inside.
*/
const SLOT=98;   // height of one R32 slot
const CARD_H=86; // actual card height (must be < SLOT)
const CARD_W=194;
const GAP=34;    // horizontal space between rounds (used for connector arms)

// R32 match order top-to-bottom, grouped by pairs feeding each R16 match
const R32_PAIRS=[[74,77],[73,75],[83,84],[81,82],[76,78],[79,80],[86,88],[85,87]];
const R32_FLAT=R32_PAIRS.flat();
const R16=[89,90,93,94,91,92,95,96];
const QF=[97,98,99,100];
const SF=[101,102];
const ROUNDS=[
  {matches:R32_FLAT, label:'Round of 32'},
  {matches:R16,      label:'Round of 16'},
  {matches:QF,       label:'Quarter-Finals'},
  {matches:SF,       label:'Semi-Finals'},
  {matches:[104],    label:'Final'},
];

function topOf(roundIdx, matchIdx){
  // slots per match doubles each round: 1, 2, 4, 8, 16
  const slotsPerMatch = Math.pow(2, roundIdx);
  const slotSpan = slotsPerMatch * SLOT;
  return matchIdx * slotSpan + (slotSpan - CARD_H) / 2;
}

function buildBracket(){
  const b=DATA.bracket;
  const totalH=16*SLOT;
  const colW=CARD_W+GAP;
  const totalW=ROUNDS.length*colW+GAP;

  // champion banner
  const champ=DATA.vincitore_finale;
  const m104=b['104'];
  let html='<div class="champion-banner">'
    +'<div class="champion-label">&#127942; Predicted Champion</div>'
    +'<div class="champion-team">'+flagImg(champ)+'<span>'+champ+'</span>'
    +'<span class="champion-prob">('+m104.vincitore.prob.toFixed(1)+'% chance)</span></div>'
    +'</div>';

  // round headers — one column per round, each colW wide
  html+='<div class="bracket-rounds-hdr" style="min-width:'+totalW+'px">';
  ROUNDS.forEach(r=>{
    html+='<div class="rh" style="width:'+colW+'px;padding-left:'+(GAP/2)+'px">'+r.label+'</div>';
  });
  html+='</div>';

  // positioned container
  html+='<div style="position:relative;min-width:'+totalW+'px;height:'+totalH+'px">';

  // SVG connector lines
  html+='<svg style="position:absolute;inset:0;width:'+totalW+'px;height:'+totalH+'px;pointer-events:none" xmlns="http://www.w3.org/2000/svg">';
  ROUNDS.forEach((r,ri)=>{
    if(ri>=ROUNDS.length-1) return;
    // right edge of current round cards
    const xRight = ri*colW + GAP/2 + CARD_W;
    // left edge of next round cards
    const xLeft  = (ri+1)*colW + GAP/2;
    const midX   = (xRight+xLeft)/2;
    r.matches.forEach((_,mi)=>{
      const cy = topOf(ri,mi) + CARD_H/2;
      const ni = Math.floor(mi/2);
      const ny = topOf(ri+1,ni) + CARD_H/2;
      // L-shaped connector: right → midX horizontal → midX vertical → left
      html+='<polyline points="'+xRight+','+cy+' '+midX+','+cy+' '+midX+','+ny+' '+xLeft+','+ny
        +'" fill="none" stroke="#1c3055" stroke-width="1.5" stroke-linejoin="round"/>';
    });
  });
  html+='</svg>';

  // match cards
  ROUNDS.forEach((r,ri)=>{
    const xLeft = ri*colW + GAP/2;
    r.matches.forEach((mn,mi)=>{
      const m=b[String(mn)];
      if(!m) return;
      const top=topOf(ri,mi);
      const sa=m.squadra_a, sb=m.squadra_b, v=m.vincitore;
      const isFinal=(mn===104);
      const winA=(v.team===sa.team);
      const score = m.gol_a.toFixed(1)+' &ndash; '+m.gol_b.toFixed(1);
      html+='<div class="bm'+(isFinal?' final-match':'')+'" '
        +'style="top:'+top+'px;left:'+xLeft+'px;width:'+CARD_W+'px;height:'+CARD_H+'px">'
        +'<div class="bm-num">M'+mn+'</div>'
        +'<div class="bm-team'+(winA?' winner':'')+'">'+flagImg(sa.team,'flag-sm')
        +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+sa.team+'</span>'
        +'<span class="bm-prob">'+sa.prob_arrivo.toFixed(0)+'%</span></div>'
        +'<hr class="bm-divider">'
        +'<div class="bm-team'+(!winA?' winner':'')+'">'+flagImg(sb.team,'flag-sm')
        +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+sb.team+'</span>'
        +'<span class="bm-prob">'+sb.prob_arrivo.toFixed(0)+'%</span></div>'
        +'<div class="bm-score">'+score+'</div>'
        +'</div>';
    });
  });

  html+='</div>'; // end positioned container

  // 3rd place match
  const m103=b['103'];
  if(m103){
    const sa=m103.squadra_a, sb=m103.squadra_b, v=m103.vincitore;
    const winA=(v.team===sa.team);
    const score3=m103.gol_a.toFixed(1)+' &ndash; '+m103.gol_b.toFixed(1);
    html+='<div class="third-block">'
      +'<div class="third-label">&#127949; 3rd Place Match &mdash; M103</div>'
      +'<div class="bm" style="position:relative;width:'+CARD_W+'px;height:'+CARD_H+'px">'
      +'<div class="bm-num">M103</div>'
      +'<div class="bm-team'+(winA?' winner':'')+'">'+flagImg(sa.team,'flag-sm')+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+sa.team+'</span><span class="bm-prob">'+sa.prob_arrivo.toFixed(0)+'%</span></div>'
      +'<hr class="bm-divider">'
      +'<div class="bm-team'+(!winA?' winner':'')+'">'+flagImg(sb.team,'flag-sm')+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+sb.team+'</span><span class="bm-prob">'+sb.prob_arrivo.toFixed(0)+'%</span></div>'
      +'<div class="bm-score">'+score3+'</div>'
      +'</div></div>';
  }

  document.getElementById('bracket-container').innerHTML='<div class="bracket-outer">'+html+'</div>';
}

/* ---- WIN PROBABILITY ---- */
function buildProbs(){
  const sorted=Object.entries(DATA.vincitore_probabilita).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0][1];
  let html='';
  sorted.forEach(([team,pct],i)=>{
    const tier=i===0?'gold':i===1?'silver':i===2?'bronze':'other';
    html+='<div class="prob-row '+tier+'">'
      +'<div class="prob-rank">'+(i+1)+'</div>'
      +'<div class="prob-team">'+flagImg(team)+'<span class="prob-team-name">'+team+'</span></div>'
      +'<div class="prob-bar-wrap"><div class="prob-bar" style="width:'+(pct/max*100).toFixed(1)+'%"></div></div>'
      +'<div class="prob-pct">'+pct.toFixed(1)+'%</div>'
      +'</div>';
  });
  document.getElementById('prob-list').innerHTML=html;
}

buildGroups();
buildBracket();
buildProbs();
</script>
